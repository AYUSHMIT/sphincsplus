<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <defs>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#feca57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#667eea" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="800" fill="#0f0f23"/>
  
  <!-- Title -->
  <text x="500" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#667eea" text-anchor="middle">
    SPHINCS+ Security Trade-offs
  </text>
  
  <text x="500" y="80" font-family="Arial, sans-serif" font-size="16" fill="#b4b4b4" text-anchor="middle">
    The Triangle: Security • Size • Speed - Pick Your Balance
  </text>
  
  <!-- Triangle visualization -->
  <g id="triangle">
    <!-- Main triangle -->
    <path d="M 500 150 L 250 600 L 750 600 Z" fill="none" stroke="url(#secGrad)" stroke-width="4"/>
    
    <!-- Corner labels -->
    <g id="security-corner">
      <circle cx="500" cy="150" r="40" fill="#43e97b" opacity="0.8"/>
      <text x="500" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f0f23" text-anchor="middle">🔒</text>
      <text x="500" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f0f23" text-anchor="middle">Security</text>
      <text x="500" y="120" font-family="Arial, sans-serif" font-size="14" fill="#43e97b" text-anchor="middle">256-bit</text>
    </g>
    
    <g id="size-corner">
      <circle cx="250" cy="600" r="40" fill="#4facfe" opacity="0.8"/>
      <text x="250" y="590" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f0f23" text-anchor="middle">📦</text>
      <text x="250" y="615" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f0f23" text-anchor="middle">Small Size</text>
      <text x="250" y="645" font-family="Arial, sans-serif" font-size="14" fill="#4facfe" text-anchor="middle">'s' variants</text>
    </g>
    
    <g id="speed-corner">
      <circle cx="750" cy="600" r="40" fill="#feca57" opacity="0.8"/>
      <text x="750" y="590" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f0f23" text-anchor="middle">⚡</text>
      <text x="750" y="615" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f0f23" text-anchor="middle">Fast Speed</text>
      <text x="750" y="645" font-family="Arial, sans-serif" font-size="14" fill="#feca57" text-anchor="middle">'f' variants</text>
    </g>
    
    <!-- Parameter set positions -->
    <!-- 128s: small size, low security -->
    <g id="param-128s">
      <circle cx="320" cy="520" r="25" fill="#667eea" opacity="0.9">
        <animate attributeName="r" values="20;28;20" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="320" y="527" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">128s</text>
      <text x="320" y="560" font-family="Arial, sans-serif" font-size="10" fill="#4facfe" text-anchor="middle">Small + Fast</text>
    </g>
    
    <!-- 128f: fast speed, low security -->
    <g id="param-128f">
      <circle cx="650" cy="520" r="25" fill="#667eea" opacity="0.9">
        <animate attributeName="r" values="20;28;20" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <text x="650" y="527" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">128f</text>
      <text x="650" y="560" font-family="Arial, sans-serif" font-size="10" fill="#feca57" text-anchor="middle">Very Fast</text>
    </g>
    
    <!-- 192s: balanced -->
    <g id="param-192s">
      <circle cx="380" cy="400" r="25" fill="#f093fb" opacity="0.9">
        <animate attributeName="r" values="20;28;20" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <text x="380" y="407" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">192s</text>
      <text x="380" y="440" font-family="Arial, sans-serif" font-size="10" fill="#b4b4b4" text-anchor="middle">Balanced</text>
    </g>
    
    <!-- 192f: fast, medium security -->
    <g id="param-192f">
      <circle cx="620" cy="400" r="25" fill="#f093fb" opacity="0.9">
        <animate attributeName="r" values="20;28;20" dur="2s" repeatCount="indefinite" begin="0.9s"/>
      </circle>
      <text x="620" y="407" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">192f</text>
      <text x="620" y="440" font-family="Arial, sans-serif" font-size="10" fill="#feca57" text-anchor="middle">Fast + Secure</text>
    </g>
    
    <!-- 256s: secure, small -->
    <g id="param-256s">
      <circle cx="440" cy="280" r="25" fill="#4facfe" opacity="0.9">
        <animate attributeName="r" values="20;28;20" dur="2s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
      <text x="440" y="287" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">256s</text>
      <text x="440" y="320" font-family="Arial, sans-serif" font-size="10" fill="#43e97b" text-anchor="middle">Max Security</text>
    </g>
    
    <!-- 256f: most secure, fast -->
    <g id="param-256f">
      <circle cx="560" cy="280" r="25" fill="#4facfe" opacity="0.9">
        <animate attributeName="r" values="20;28;20" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
      <text x="560" y="287" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">256f</text>
      <text x="560" y="320" font-family="Arial, sans-serif" font-size="10" fill="#43e97b" text-anchor="middle">Best Overall</text>
    </g>
  </g>
  
  <!-- Explanation boxes -->
  <g id="explanations">
    <!-- Bottom left explanation -->
    <rect x="30" y="650" width="200" height="120" fill="#1a1a2e" stroke="#4facfe" stroke-width="2" rx="10"/>
    <text x="130" y="675" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4facfe" text-anchor="middle">
      Small Signatures
    </text>
    <text x="130" y="695" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="middle">
      's' parameter sets
    </text>
    <text x="40" y="715" font-family="Arial, sans-serif" font-size="10" fill="#888888">
      • Minimize bandwidth
    </text>
    <text x="40" y="732" font-family="Arial, sans-serif" font-size="10" fill="#888888">
      • Best for IoT devices
    </text>
    <text x="40" y="749" font-family="Arial, sans-serif" font-size="10" fill="#888888">
      • Slower signing
    </text>
    
    <!-- Bottom right explanation -->
    <rect x="770" y="650" width="200" height="120" fill="#1a1a2e" stroke="#feca57" stroke-width="2" rx="10"/>
    <text x="870" y="675" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#feca57" text-anchor="middle">
      Fast Signing
    </text>
    <text x="870" y="695" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="middle">
      'f' parameter sets
    </text>
    <text x="780" y="715" font-family="Arial, sans-serif" font-size="10" fill="#888888">
      • High throughput
    </text>
    <text x="780" y="732" font-family="Arial, sans-serif" font-size="10" fill="#888888">
      • Best for servers
    </text>
    <text x="780" y="749" font-family="Arial, sans-serif" font-size="10" fill="#888888">
      • Larger signatures
    </text>
    
    <!-- Top explanation -->
    <rect x="400" y="30" width="200" height="80" fill="#1a1a2e" stroke="#43e97b" stroke-width="2" rx="10"/>
    <text x="500" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#43e97b" text-anchor="middle">
      Security Levels
    </text>
    <text x="500" y="75" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="middle">
      128-bit • 192-bit • 256-bit
    </text>
    <text x="410" y="95" font-family="Arial, sans-serif" font-size="10" fill="#888888">
      Higher security = longer keys/sigs
    </text>
  </g>
  
  <!-- Footer -->
  <text x="500" y="790" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">
    Choose based on your requirements: bandwidth-constrained → 's', high-throughput → 'f', maximum security → 256
  </text>
</svg>
