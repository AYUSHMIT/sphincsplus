<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000">
  <defs>
    <linearGradient id="quantumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5576c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="1000" fill="#0f0f23"/>
  
  <!-- Title -->
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="url(#quantumGrad)" text-anchor="middle">
    ⚛️ The Quantum Computing Threat
  </text>
  
  <text x="600" y="95" font-family="Arial, sans-serif" font-size="18" fill="#b4b4b4" text-anchor="middle">
    Why We Need Post-Quantum Cryptography Now
  </text>
  
  <!-- Timeline -->
  <g id="timeline">
    <text x="100" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#667eea" text-anchor="start">
      Timeline: The Race Against Quantum Computers
    </text>
    
    <!-- Timeline line -->
    <line x1="100" y1="200" x2="1100" y2="200" stroke="#667eea" stroke-width="4"/>
    
    <!-- Timeline markers -->
    <g id="marker-1994">
      <circle cx="200" cy="200" r="10" fill="#4facfe" filter="url(#glow)"/>
      <text x="200" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4facfe" text-anchor="middle">1994</text>
      <text x="200" y="250" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="middle">Shor's Algorithm</text>
      <text x="200" y="265" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">discovered</text>
    </g>
    
    <g id="marker-2015">
      <circle cx="400" cy="200" r="10" fill="#feca57"/>
      <text x="400" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#feca57" text-anchor="middle">2015</text>
      <text x="400" y="250" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="middle">NIST PQC</text>
      <text x="400" y="265" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">competition starts</text>
    </g>
    
    <g id="marker-2022">
      <circle cx="600" cy="200" r="10" fill="#43e97b"/>
      <text x="600" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#43e97b" text-anchor="middle">2022</text>
      <text x="600" y="250" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="middle">SPHINCS+</text>
      <text x="600" y="265" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">selected</text>
    </g>
    
    <g id="marker-now">
      <circle cx="800" cy="200" r="12" fill="#f093fb" filter="url(#glow)">
        <animate attributeName="r" values="10;14;10" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="800" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f093fb" text-anchor="middle">2024</text>
      <text x="800" y="250" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="middle">YOU ARE</text>
      <text x="800" y="265" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">HERE</text>
    </g>
    
    <g id="marker-future">
      <circle cx="1000" cy="200" r="10" fill="#f5576c"/>
      <text x="1000" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f5576c" text-anchor="middle">2030+</text>
      <text x="1000" y="250" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="middle">Quantum</text>
      <text x="1000" y="265" font-family="Arial, sans-serif" font-size="10" fill="#888888" text-anchor="middle">threat real</text>
    </g>
  </g>
  
  <!-- Threat Comparison -->
  <g id="threat-comparison">
    <text x="100" y="340" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#667eea" text-anchor="start">
      Classical vs Post-Quantum Cryptography
    </text>
    
    <!-- Classical algorithms box -->
    <g id="classical">
      <rect x="100" y="370" width="480" height="250" fill="#1a1a2e" stroke="url(#dangerGrad)" stroke-width="3" rx="15"/>
      <text x="340" y="405" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f5576c" text-anchor="middle">
        ❌ Classical Algorithms (VULNERABLE)
      </text>
      
      <!-- RSA -->
      <rect x="120" y="430" width="200" height="70" fill="#16213e" stroke="#f5576c" stroke-width="2" rx="8"/>
      <text x="220" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
        RSA-2048
      </text>
      <text x="130" y="477" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="start">
        Classical: ✅ Secure (2^128 ops)
      </text>
      <text x="130" y="492" font-family="Arial, sans-serif" font-size="11" fill="#f5576c" text-anchor="start">
        Quantum: ❌ BROKEN (polynomial time)
      </text>
      
      <!-- ECDSA -->
      <rect x="340" y="430" width="220" height="70" fill="#16213e" stroke="#f5576c" stroke-width="2" rx="8"/>
      <text x="450" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
        ECDSA P-256
      </text>
      <text x="350" y="477" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="start">
        Classical: ✅ Secure (2^128 ops)
      </text>
      <text x="350" y="492" font-family="Arial, sans-serif" font-size="11" fill="#f5576c" text-anchor="start">
        Quantum: ❌ BROKEN (polynomial time)
      </text>
      
      <!-- Attack method -->
      <rect x="120" y="520" width="440" height="80" fill="#2d1b1b" stroke="#f5576c" stroke-width="2" rx="8"/>
      <text x="340" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f5576c" text-anchor="middle">
        ⚠️ Vulnerable to Shor's Algorithm
      </text>
      <text x="130" y="565" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="start">
        • Quantum computers can factor large numbers efficiently
      </text>
      <text x="130" y="580" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="start">
        • Solve discrete logarithm problem in polynomial time
      </text>
      <text x="130" y="595" font-family="Arial, sans-serif" font-size="11" fill="#f5576c" text-anchor="start">
        • Breaks all current public-key cryptography!
      </text>
    </g>
    
    <!-- Post-quantum box -->
    <g id="postquantum">
      <rect x="620" y="370" width="480" height="250" fill="#1a1a2e" stroke="url(#safeGrad)" stroke-width="3" rx="15"/>
      <text x="860" y="405" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#43e97b" text-anchor="middle">
        ✅ Post-Quantum (SAFE)
      </text>
      
      <!-- SPHINCS+ -->
      <rect x="640" y="430" width="440" height="70" fill="#16213e" stroke="#43e97b" stroke-width="2" rx="8"/>
      <text x="860" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
        SPHINCS+
      </text>
      <text x="650" y="477" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="start">
        Classical: ✅ Secure (2^128/192/256 ops)
      </text>
      <text x="650" y="492" font-family="Arial, sans-serif" font-size="11" fill="#43e97b" text-anchor="start">
        Quantum: ✅ STILL SECURE (2^64/96/128 effective)
      </text>
      
      <!-- Why safe -->
      <rect x="640" y="520" width="440" height="80" fill="#1b2d1b" stroke="#43e97b" stroke-width="2" rx="8"/>
      <text x="860" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#43e97b" text-anchor="middle">
        🛡️ Based on Hash Function Security
      </text>
      <text x="650" y="565" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="start">
        • No efficient quantum algorithm to break hash functions
      </text>
      <text x="650" y="580" font-family="Arial, sans-serif" font-size="11" fill="#b4b4b4" text-anchor="start">
        • Grover's algorithm only provides quadratic speedup
      </text>
      <text x="650" y="595" font-family="Arial, sans-serif" font-size="11" fill="#43e97b" text-anchor="start">
        • Parameters account for quantum speedup (still secure!)
      </text>
    </g>
  </g>
  
  <!-- Store Now, Decrypt Later -->
  <g id="harvest-now">
    <rect x="100" y="660" width="1000" height="140" fill="#2d1b1b" stroke="#f5576c" stroke-width="3" rx="15"/>
    <text x="600" y="695" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#f5576c" text-anchor="middle">
      ⚠️ "Store Now, Decrypt Later" Attack
    </text>
    
    <text x="120" y="725" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="start">
      <tspan font-weight="bold">The Threat:</tspan> Adversaries are collecting encrypted data TODAY to decrypt when quantum computers become available.
    </text>
    
    <g id="attack-timeline">
      <circle cx="200" cy="755" r="8" fill="#feca57"/>
      <text x="220" y="760" font-family="Arial, sans-serif" font-size="13" fill="#b4b4b4" text-anchor="start">
        <tspan font-weight="bold" fill="#feca57">Today:</tspan> Harvest encrypted communications
      </text>
      
      <text x="180" y="775" font-family="Arial, sans-serif" font-size="20" fill="#888888" text-anchor="middle">→</text>
      
      <circle cx="600" cy="755" r="8" fill="#f5576c"/>
      <text x="620" y="760" font-family="Arial, sans-serif" font-size="13" fill="#b4b4b4" text-anchor="start">
        <tspan font-weight="bold" fill="#f5576c">2030+:</tspan> Decrypt with quantum computer
      </text>
    </g>
  </g>
  
  <!-- Migration recommendation -->
  <g id="recommendation">
    <rect x="100" y="830" width="1000" height="120" fill="#1a1a2e" stroke="#43e97b" stroke-width="3" rx="15"/>
    <text x="600" y="865" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#43e97b" text-anchor="middle">
      🚀 Migrate to Post-Quantum Cryptography NOW!
    </text>
    
    <text x="120" y="895" font-family="Arial, sans-serif" font-size="14" fill="#b4b4b4" text-anchor="start">
      <tspan font-weight="bold" fill="#ffffff">Why now?</tspan>
    </text>
    <text x="140" y="915" font-family="Arial, sans-serif" font-size="13" fill="#b4b4b4" text-anchor="start">
      • Long-lived data needs protection before quantum computers arrive
    </text>
    <text x="140" y="933" font-family="Arial, sans-serif" font-size="13" fill="#b4b4b4" text-anchor="start">
      • Migration takes time - start transitioning infrastructure today
    </text>
    
    <text x="620" y="895" font-family="Arial, sans-serif" font-size="14" fill="#b4b4b4" text-anchor="start">
      <tspan font-weight="bold" fill="#ffffff">How?</tspan>
    </text>
    <text x="640" y="915" font-family="Arial, sans-serif" font-size="13" fill="#b4b4b4" text-anchor="start">
      • Adopt NIST-standardized algorithms like SPHINCS+
    </text>
    <text x="640" y="933" font-family="Arial, sans-serif" font-size="13" fill="#b4b4b4" text-anchor="start">
      • Implement hybrid schemes (classical + post-quantum)
    </text>
  </g>
  
  <!-- Footer -->
  <text x="600" y="985" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">
    Learn more: https://sphincs.org/ • https://csrc.nist.gov/Projects/Post-Quantum-Cryptography
  </text>
</svg>
